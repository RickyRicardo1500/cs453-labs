openapi: 3.0.3
info:
  title: Lab 3 Item API
  version: 1.0.0
  description: This API describes the request and response body for the client and server.

servers:
  - url: http://localhost:3000

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Server is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /items: 
    get: # Completed: Document GET /items.
      summary: Retrieve Items list
      responses:
        "200":
          description: Items return in an array
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: array
                    example:  [{
                                "id": 1,
                                "name": "keyboard",
                                "quantity": 10
                              },
                              {
                                "id": 2,
                                "name": "mouse",
                                "quantity": 5
                              }
                              ]
    post: # Completed: Document POST /items.
      summary: New item
      responses:
        "201":
          description: Creates a new item in the array
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: object
                    example:  {
                                "name": "monitor",
                                "quantity": 4
                              }
        "400":
          description: Item creation unsuccesful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: object
                    example:  {
                                "error": "Missing required fields or contains invalid data"
                              }
  /items/{id}
    get: # Completed: Document GET /items/{id}.
      summary: Retrieve Item
      responses:
        "200":
          description: Item returned by id
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: object
                    example:  {
                                "id": 1,
                                "name": "keyboard",
                                "quantity": 10
                              }
        "404":
          description: Item doesn't exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: object
                    example:  {
                                "error": "Item not found"
                              }
    put: # Completed: Document PUT /items/{id}.
      summary: Update item
      responses:
        "200":
          description: Update an existing item in the array and return it
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: object
                    example:  {
                                "name": "monitor",
                                "quantity": 4
                              }
        "400":
          description: Item update unsuccesful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: object
                    example:  {
                                "error": "Missing required fields or contains invalid data"
                              }
        "404":
          description: Item doesn't exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: object
                    example:  {
                                "error": "Item not found"
                              }
    delete: # Completed: Document DELETE /items/{id}.
      summary: Delete an item
      responses:
        "204":
          description: Deleted an existing item in the array
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example:  "deleted"
        "404":
          description: Item doesn't exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: object
                    example:  {
                                "error": "Item not found"
                              }
  #
  # Remember:
  # - Express routes use :id, such as /items/:id.
  # - OpenAPI paths use {id}, such as /items/{id}.
  #
  # You may define schemas under components/schemas if you want to avoid
  # repeating the same object structure many times.

components:
  schemas:
    Item: # Completed: Define an Item schema with id, name, and quantity.
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: keyboard
        quantity:
          type: number
          example: 10
      required: [id, name, quantity]
    ItemInput: # Completed: Define an ItemInput schema with name and quantity.
      type: object
      properties:
        name:
          type: string
          example: keyboard
        quantity:
          type: number
          example: 10
      required: [name, quantity]
    ErrorResponse: # Completed: Define an ErrorResponse schema with an error message.
      type: object
      properties:
        error:
          type: string
          example: Item not found
      required: error
